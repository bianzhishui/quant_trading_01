[project]
name = "quant-trading-01"
version = "0.1.0"
description = "A股量化交易学习项目：数据获取 + 回测引擎 + 策略示例"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "baostock>=0.8.9",
    "akshare>=1.14",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
# 格式：ruff 默认风格（line-length 88, double quotes, 默认换行规则）
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# 保持 ruff 默认的安全集(E4/E7/E9/F): 语法错误/未定义/未使用/可疑 — 不启用激进规则
select = ["E4", "E7", "E9", "F"]
# E402: 研究脚本有意在 sys.path 设置/配置后导入模块(标准模式), 忽略
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 无 [build-system]：本项目作为“虚拟项目”管理，uv sync 只安装依赖，
# 代码通过 run_backtest.py 里的 sys.path 直接导入运行。
