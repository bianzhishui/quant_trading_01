# ============================================================
# R5 等权575 全量配置（权威基底）
# 加载规则（research/config.py）：
#   1. 始终加载本文件（缺失 → 报错，无兜底）
#   2. 若指定 --config / QUANT_CONFIG 配置文件 → 深合并覆盖本文件（同 key 覆盖）
#   3. 指定文件不存在 → 报错退出
#   4. 代码不 hardcode 配置值；冻结参数偏离校验以本文件为基准（见 strategy/costs 段）
# ============================================================

# ---------- 路径 ----------
paths:
  # 相对仓库根的路径
  full_dir: "data/fundamental/full_daily"      # 年分区行情目录
  full_file: "data/fundamental/full_daily.parquet"  # 全量行情文件
  stock_basic: "data/fundamental/stock_basic.parquet"  # 股票宇宙清单
  round2: "data/round2"                        # 因子/辅助数据
  output: "output"                             # 输出（账本/CSV/图）
  live_fac: "data/round2/adjust_factor_live.parquet"  # 实时复权因子增量

# ---------- 策略（冻结参数区，改动需预注册） ----------
strategy:
  start: "2013-06-01"        # 数据起点（因子预热窗口）
  min_n: 50                  # 池 < 50 跳过该月（冻结）
  min_ind: 5                 # 行业 < 5 剔除（冻结）
  amihud_w: 0.85             # Amihud 打分权重（冻结，0.85:0.15，Round 28/29 批准）
  limit_thr: 0.098           # 涨停近似阈值（冻结）
  lookback: 21               # 反转/Amihud 回看期（交易日）
  n_q: 5                     # 分组数（qcut quintile）
  eras:                      # 分段检验窗口
    "2014-2017": ["2014-01-01", "2017-12-31"]
    "2018-2021": ["2018-01-01", "2021-12-31"]
    "2022-2026": ["2022-01-01", null]

# ---------- 成本/费用（冻结参数区，改动需预注册） ----------
costs:
  comm_rate: 0.00015         # 佣金 万1.5（冻结）
  comm_min: 5.0              # 单笔最低 5 元（冻结）
  stamp_rate: 0.0005         # 印花税 万5，仅卖出（冻结）
  transfer_rate: 0.00001     # 过户费 万0.1，双边（冻结）
  div_tax: 0.10              # 红利税 10%（冻结）
  slip_default: 0.0015       # 滑点 15bp（Round 32/33 三口径统一）
  cost_base: 0.0015          # 基准全成本 15bp/单边
  cost_sweep: [0.0025, 0.0035]  # 成本扫描档位

# ---------- 账户（运营/场景） ----------
accounts:
  aum_list: [600000, 1000000, 3000000, 6000000]  # 四账户规模
