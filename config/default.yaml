# ============================================================
# R5 等权575 全量配置（权威基底）
# 加载规则（research/config.py）：
#   1. 始终加载本文件（缺失 → 报错，无兜底）
#   2. 若指定 --config / QUANT_CONFIG 配置文件 → 深合并覆盖本文件（同 key 覆盖）
#   3. 指定文件不存在 → 报错退出
#   4. 代码不 hardcode 配置值；冻结参数偏离校验以本文件为基准（见 strategy/costs 段）
# ============================================================

# ---------- 路径 ----------
paths:
  # 相对仓库根的路径
  data: "data"                              # 数据根目录(含 data_loader 的 CSV 缓存)
  fundamental: "data/fundamental"             # 基本面数据根目录
  full_dir: "data/fundamental/full_daily"      # 年分区行情目录
  full_file: "data/fundamental/full_daily.parquet"  # 全量行情文件
  stock_basic: "data/fundamental/stock_basic.parquet"  # 股票宇宙清单
  round2: "data/round2"                        # 因子/辅助数据
  output: "output"                             # 输出（账本/CSV/图）
  live_fac: "data/round2/adjust_factor_live.parquet"  # 实时复权因子增量

# ---------- 策略（冻结参数区，改动需预注册） ----------
strategy:
  start: "2013-06-01"        # 数据起点（因子预热窗口）
  min_n: 50                  # 池 < 50 跳过该月（冻结）
  min_ind: 5                 # 行业 < 5 剔除（冻结）
  # 三因子打分权重（冻结，和=1.0，Round 38 样本外验证采纳；原 0.85/0.15 二因子被取代）
  w_amihud: 0.40             # Amihud 权重（Round 38: 0.40）
  w_mom: 0.10                # 中期动量权重（Round 38: 0.10）
  w_f4: 0.50                 # F4 低成交额5 权重（Round 38: 0.50）
  limit_thr: 0.098           # 涨停近似阈值（冻结）
  r5:                        # R5 生产公式窗口（冻结：改动=改选股逻辑, 须预注册）
    amihud_lookback: 21      # Amihud 回看期(交易日)
    amihud_min_periods: 15   # Amihud 滚动最小期数
    amihud_scale: 1000000    # Amihud 放缩系数 ×1e6（单调变换, 不影响截面排序）
    mom_short: 21            # 中期动量短窗 T-21
    mom_long: 250            # 中期动量长窗 T-250
    seasoning: 375           # 上市天数下限(seasoning)
    quantile: 5              # 行业内百分位分组数, 取最高组 = 前 1/5 = 前20%
    f4_window: 5             # F4 低成交额 5 日均窗口（Round 38, 冻结）
  lookback: 21               # reversal_factor 探索用回看期（非 R5 生产, 可调）
  n_q: 5                     # reversal_factor 探索用分组数（非 R5 生产, 可调）
  eras:                      # 分段检验窗口
    "2014-2017": ["2014-01-01", "2017-12-31"]
    "2018-2021": ["2018-01-01", "2021-12-31"]
    "2022-2026": ["2022-01-01", null]

# ---------- 成本/费用（冻结参数区，改动需预注册） ----------
costs:
  comm_rate: 0.00015         # 佣金 万1.5（冻结）
  comm_min: 5.0              # 单笔最低 5 元（冻结）
  stamp_rate: 0.0005         # 印花税 万5，仅卖出（冻结）
  transfer_rate: 0.00001     # 过户费 万0.1，双边（冻结）
  div_tax: 0.10              # 红利税 10%（冻结）
  slip_default: 0.0015       # 滑点 15bp（Round 32/33 三口径统一）
  cost_base: 0.0015          # 基准全成本 15bp/单边
  cost_sweep: [0.0025, 0.0035]  # 成本扫描档位
  # Round35 流动性依赖滑点（评估口径 B，冻结）：按执行日成交额分档
  # slip_bounds = 全样本 amount 分位数 Q20/40/60/80（2026-09-16 计算冻结）
  slip_bounds: [26335838, 55335944, 109676941, 254055328]
  slip_tiers: [0.004, 0.0025, 0.0015, 0.001, 0.0005]  # 低量→高滑点: <Q20=40bp ... ≥Q80=5bp

# ---------- 账户（运营/场景） ----------
accounts:
  aum_list: [600000, 1000000, 3000000, 6000000]  # 四账户规模

# ---------- 数据抓取（fetch 脚本） ----------
fetch:
  corporate_actions:
    out_factor: "data/round2/adjust_factor.parquet"
    out_dividends: "data/round2/dividends.parquet"
    start: "2012-01-01"      # 复权因子查询起点(早于日线窗口, 覆盖因子预热)
    end: "2026-09-03"        # 静态因子/分红抓取截止(= paper_live 判断是否需要实时查询的静态截止)
    pause: 0.15              # 请求间停顿(秒)
    relogin: 200             # 每 N 次重登
    empty_streak: 50         # 连续空结果次数阈值
    backoff: 90              # 退避秒数
  daily_incremental:
    print_every: 500         # 进度打印间隔
  full_industry:
    out: "data/round2/industry_full.parquet"
  full_market:
    start: "2012-06-01"      # 全市场日线抓取窗口
    end: "2026-09-07"
    flush_every: 100         # 每 N 只刷盘
    stall_limit_s: 480       # 看门狗: 无进展超时秒数
  round2_data:
    out_dir: "data/round2"
    start: "2013-01-01"      # fetch_round2_data baostock 起点
    end: "2026-09-03"
  live:
    fac_end: "2026-12-31"    # paper_live 实时公司行为查询上界(年末哨兵)

# ---------- 监控（factor_health） ----------
monitor:
  baseline_start: "2014-01-01"   # RankIC 历史基准起点
  baseline_end: "2026-08-31"     # 历史基准终点(建仓前)
  live_start: "2026-09-01"       # 运营期起点(= 四账户建仓日)
